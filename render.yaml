services:
  - type: web
    name: military-assest-management-api
    env: node
    rootDir: backend
    buildCommand: cd ../frontend && npm install --include=dev && npm run build && node -e "fs.cpSync('dist', '../backend/public', { recursive: true })" && cd ../backend && npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: military-asset-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: military-asset-db
    databaseName: military_assets
    user: military_user
